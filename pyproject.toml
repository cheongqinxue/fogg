[project]
name = "fogg"
version = "0.1.0"
description = "FOGG travel agent — Google Maps client and tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "pre-commit>=4.7.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "redis>=5.0.0",
    "tenacity>=9.0.0",
    "fakeredis>=2.26.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-benchmark>=5.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph-cli[inmem]>=0.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langchain>=1.4.9",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary,pool]>=3.3.8",
    "python-dotenv>=1.2.4",
    "firebase-admin>=6.0.0",
    "google-cloud-kms>=2.0.0",
    "cryptography>=42.0.0",
    "sseclient-py>=1.9.0",
    "openinference-instrumentation-langchain>=0.1.86",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agent/src/master", "agent/src/api", "agent/src/layout", "agent/src/gmaps", "agent/src/utils", "agent/src/web_search_tool", "backend"]

[tool.hatch.build.targets.wheel.sources]
"agent/src/gmaps" = "gmaps"
"backend" = "backend"
"agent/src/master" = "master"
"agent/src/api" = "api"
"agent/src/layout" = "layout"
"agent/src/utils" = "utils"
"agent/src/web_search_tool" = "web_search_tool"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["agent/tests"]
addopts = "--strict-markers"
markers = [
    "unit: fast isolated tests (pre-commit and default local runs)",
    "integration: Redis, network, or heavy setup (excluded from pre-commit)",
    "benchmark: gmaps performance regression (mocked Google; run benchmarks/ explicitly)",
    "simulated_google: reference benchmarks with fixed mock HTTP latency",
]

[tool.pytest-benchmark]
min_rounds = 5
group = "overhead"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".tools"]

[tool.ruff.lint]
ignore = [
    "COM812",  # trailing comma — conflicts with formatter
    "E501",    # line length — handled by ruff format
    "EM101",   # exception must not use a string literal
    "EM102",   # exception must not use an f-string literal
    "ISC001",  # implicit string concat — conflicts with formatter
    "PLR0913", # too many arguments
    "TRY003",  # long messages outside exception class
]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = ["INP001", "T20"]
"agent/tests/**/*.py" = ["PLR2004", "S101"]
