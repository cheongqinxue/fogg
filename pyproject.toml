[project]
name = "fogg"
version = "0.1.0"
description = "FOGG travel agent — Google Maps client and tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "redis>=5.0.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "fakeredis>=2.26.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-benchmark>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["backend/gmaps"]

[tool.hatch.build.targets.wheel.sources]
"backend/gmaps" = "gmaps"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: fast isolated tests (pre-commit and default local runs)",
    "integration: Redis, network, or heavy setup (excluded from pre-commit)",
    "benchmark: gmaps performance regression (mocked Google; run benchmarks/ explicitly)",
    "simulated_google: reference benchmarks with fixed mock HTTP latency",
]

[tool.pytest-benchmark]
min_rounds = 5
group = "overhead"

[tool.ruff]
line-length = 100
