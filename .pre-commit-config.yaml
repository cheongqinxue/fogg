# .pre-commit-config.yaml
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.6.0  # Use the latest stable version
  hooks:
    - id: trailing-whitespace
    - id: end-of-file-fixer
    - id: check-yaml
    - id: check-json
    - id: debug-statements

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.5.0 # Use the latest stable version tag for Ruff
  hooks:
    # 1. Formatting Hook (Auto-Fixes Style)
    - id: ruff-format
      name: Python Formatting (Ruff Format)

    # 2. Linting Hook (Checks for Code Smells/Bugs)
    - id: ruff
      args: ["--fix"] # Automatically fix simple linting issues
      name: Python Linting (Ruff Check)

- repo: local
  hooks:
    - id: gitleaks
      name: Detect secrets in staged changes (gitleaks)
      entry: scripts/gitleaks-staged.sh
      language: system
      pass_filenames: false
    - id: pytest-unit
      name: pytest (unit tests only)
      entry: scripts/pytest-unit.sh
      language: system
      pass_filenames: false
      always_run: true
